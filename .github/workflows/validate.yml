name: Validate release catalog sync
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Check version policy and final README table
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/catalog.py check --base-ref "$BASE_REF"
